<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://cdn.boxicons.com/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <title>Document</title>
</head>
<style>
    body {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    nav {
        display: flex;
        justify-content: space-between;
        text-align: center;
        align-items: center;
        padding: 20px;
    }

    nav ul {
        display: flex;
        gap: 10px;
        list-style: none;
    }

    nav ul li {
        position: relative;
    }

    nav ul li a {
        text-decoration: none;
        color: #000;
    }

    ul .dropdown-content {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        background: #f0f0f0;
        padding: 10px 0;
        min-width: 300px;
        text-align: left;

    }

    .dropdown-content li a {
        padding: 10px;
        color: #333;

    }

    /* Tampilkan saat diklik (ditambah class 'show') */
    .dropdown-content.show {
        display: block;
    }

    .dropdown-content.show ul li {
        display: flex;
        flex-wrap: wrap;
    }

    .menu-toggle {
        display: none;
        font-size: 28px;
        cursor: pointer;
        padding: 10px;
    }

    .nav-menu {
        display: flex;
        justify-content: center;
    }

    .nav-wrapper {
        display: flex;
        align-items: center;
        width: 100%;
    }


    @media (min-width: 320px) and (max-width: 765px) {
        nav ul {
            display: none;
        }

        nav ul.show {
            display: flex;
        }

        .menu-toggle {
            display: block;
        }


    }
</style>

<body>
    <nav>
        <div class="nav-wrapper">
            <h2>SFRT</h2>

            <div class="menu-toggle" id="menu-toggle">
                <i class='bx bx-menu'></i>
            </div>

            <div class="nav-menu">

                <ul class="nav-link">
                    <li><a href="">Home</a></li>
                    <li><a href="">About</a></li>
                    <li><a href="" id="dropdownBtn">Service <i class='bx  bx-arrow-down-stroke'></i></a>
                        <ul class="dropdown-content" id="dropdownMenu">
                            <li><a href="#">Deteksi Jenis BBM</a></li>
                            <li><a href="#">Pembayaran E-Wallet</a></li>
                            <li><a href="#">Keamanan Sistem</a></li>
                            <li><a href="#">Monitoring</a></li>
                        </ul>
                    </li>
                    <li><a href="">Contact</a></li>
                    <li><a href="">Booking</a></li>
                    <li> <button>Login</button></li>
                </ul>
            </div>
        </div>
        </div>
    </nav>

    <script>
        const dropdownBtn = document.getElementById('dropdownBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');

        dropdownBtn.addEventListener('click', function (e) {
            e.preventDefault();
            dropdownMenu.classList.toggle('show');
        })
    </script>


    <!-- SCRIPT NAVBAR -->
    <script>
        const toggle = document.getElementById('menu-toggle');
        const navLinks = document.querySelector('nav ul');

        toggle.addEventListener('click', () => {
            navLinks.classList.toggle('show');
        });
    </script>
</body>

</html>
