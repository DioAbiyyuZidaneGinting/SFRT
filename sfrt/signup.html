<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <div class="container-akun-signup">
        <div class="header-akun">
            <div class="icon-signup">
                <i class="fa-solid fa-gas-pump"></i>
            </div>
            <h1>Join SFRT</h1>
            <p class="desripsi">Create your fuel station account</p>

            <div class="form-box">
                <label for="">Full Name</label>
                <div class="input-box">
                    <i class="bx bx-user"></i>
                    <input type="text" placeholder="Enter your full name" required>
                </div>
                <label for="">Username</label>
                <div class="input-box">
                    <i class="bx bx-user-check"></i>
                    <input type="text" placeholder="Enter your username" required>
                </div>
                <label for="">Email Address</label>
                <div class="input-box">
                    <i class="bx bx-phone"></i>
                    <input type="email" placeholder="Enter your phone number" required>
                </div>
                <label for="">Email Address</label>
                <div class="input-box">
                    <i class="bx bx-envelope"></i>
                    <input type="email" placeholder="Enter your email address" required>
                </div>

                <label for="">Password</label>
                <div class="input-box">
                    <i class="bx bx-lock"></i>
                    <input type="email" placeholder="Enter your password" required>
                    <i class="fa-regular fa-eye"></i>
                </div>
                <label for="">Confirm Password</label>
                <div class="input-box">
                    <i class="bx bx-lock"></i>
                    <input type="email" placeholder="Enter your password" required>
                    <i class="fa-regular fa-eye"></i>
                </div>

                <div class="options-signup">
                    <label for=""><input type="checkbox">I agree to the <a href="">Terms of Service</a> and
                        <a>Privacy Policy</a></label>

                </div>

                <a href="signin.html"><Button class="btn-signin">Sign In <i
                            class="fa-solid fa-arrow-right"></i></Button></a>

                <p class="Signin">Already have an account? <a href="signin.html">Sign In</a></p>
            </div>
        </div>
        <p class="footer-copyright">© 2025 SFRT Gas Station. All rights reserved.</p>
    </div>
</body>

</html>
