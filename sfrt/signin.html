<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <div class="container-akun">
        <div class="header-akun">
            <div class="icon-signin">
                <i class="fa-solid fa-gas-pump"></i>
            </div>
            <h1>Welcome to SFRT</h1>
            <p class="desripsi">Sign in to your fuel station account</p>

            <div class="form-box">
                <label for="">Email Address</label>
                <div class="input-box">
                    <i class="bx bx-envelope"></i>
                    <input type="email" placeholder="Enter your email address" required>
                </div>

                <label for="">Password</label>
                <div class="input-box">
                    <i class="bx bx-lock"></i>
                    <input type="email" placeholder="Enter your password" required>
                    <i class="fa-regular fa-eye" id="lock"></i>
                </div>

                <div class="options">
                    <label for=""><input type="checkbox"> Remember Me</label>
                    <a href="forgotpass.html">Forgot Password?</a>
                </div>

                <a href="profil.html"><Button class="btn-signin">Sign In <i
                            class="fa-solid fa-arrow-right"></i></Button></a>

                <p class="Signup">Don't have an account? <a href="signup.html">Sign Up</a></p>
            </div>
        </div>
        <p class="footer-copyright">© 2025 SFRT Gas Station. All rights reserved.</p>
    </div>


    <script>
        const lock = document.getElementById('lock');
        const passwordInput = document.querySelector('input[type="email"][placeholder="Enter Your Password"]')
    </script>
</body>

</html>
